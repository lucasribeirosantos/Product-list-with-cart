<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="./css/main.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Product list with cart</title>

</head>
<body>
  <h1 class="title">Desserts</h1>
  <main>
    <section id="products-list" class="main-list"></section>

    <section class="cart">
      <h2 class="cart-title">Your Cart (<span id="cart-count" class="cart-count">0</span>)</h2>

      <!------EMPTY CART------>
      <div class="empty-info cart-hide">
        <img src="./assets/images/illustration-empty-cart.svg" alt="Empty cart image" class="empty-cart-img" id="empty-cart-img">
        <p class="empty-msg" id="empty-cart-msg">Your added itens will appear here</p>
      </div>

      <!------ACTIVE CART------>
      <div class="active-cart">
        <div class="cart-products"></div>

        <div class="order">
          <div class="total">
            <h2>Order Total</h2>
            <span class="total-price" id="total-price">$0.00</span>
          </div>

          <p>This is a <strong>carbon-neutral</strong>delivery</p>

          <button id="confirm-order">Confirm Order</button>
        </div>
      </div>
    </section>

  </main>

  <script src="./js/index.js" type="text/javascript"></script>
</body>
</html>
